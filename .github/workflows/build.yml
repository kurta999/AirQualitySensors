name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure host tests
        run: cmake -S tests -B build/host-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/host-tests --parallel
      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, wifi-check, nucleo-i2c, nucleo-sensors, nucleo-bsec, hardware-off]
    steps:
      - uses: actions/checkout@v6
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install --yes gcc-arm-none-eabi ninja-build
      - name: Configure firmware
        if: matrix.preset != 'nucleo-bsec'
        run: cmake --preset ${{ matrix.preset }}
      - name: Install pinned Bosch package
        if: matrix.preset == 'nucleo-bsec'
        shell: pwsh
        run: ./scripts/Install-Bsec.ps1
      - name: Configure BSEC firmware
        if: matrix.preset == 'nucleo-bsec'
        run: cmake --preset nucleo-bsec
      - name: Build firmware
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/AirQualitySensors.elf
            build/${{ matrix.preset }}/AirQualitySensors.hex
            build/${{ matrix.preset }}/AirQualitySensors.bin
            build/${{ matrix.preset }}/AirQualitySensors.map
            libs/bsec/LICENSE.md
          if-no-files-found: error
