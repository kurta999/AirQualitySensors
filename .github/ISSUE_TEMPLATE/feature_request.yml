name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the problem and why existing behavior is insufficient
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include hardware, protocol, compatibility, and testing implications
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
